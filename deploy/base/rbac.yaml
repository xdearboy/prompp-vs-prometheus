apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector
  namespace: prompp-bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: collector
  namespace: prompp-bench
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prompp-bench-metrics
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/proxy"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prompp-bench-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prompp-bench-metrics
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: prompp-bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: collector
  namespace: prompp-bench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: collector
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: prompp-bench